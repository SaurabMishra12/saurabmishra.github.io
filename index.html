/* ------------------------------------------------------------
   5 · WINDOW MANAGER
   One pointer pipeline for drag and resize, driven by rAF so
   that moving a window costs one style write per frame.
   ------------------------------------------------------------ */
const layer = () => $('#window-layer');
const deskRect = () => $('#desktop').getBoundingClientRect();

/**
 * Play one CSS animation class on an element and run `done` exactly once —
 * whether the animation finishes, is interrupted, or never starts at all.
 * Starting a new animation cancels any pending completion on that element,
 * which is what stops a minimise handler from firing during a later restore.
 */
function runAnim(el, cls, done, ms = 420) {
  el._anim?.abort();
  const ac = new AbortController();
  el._anim = ac;
  let settled = false;
  const finish = () => {
    if (settled) return;
    settled = true;
    ac.abort();
    if (el._anim === ac) el._anim = null;
    el.classList.remove(cls);
    done?.();
  };
  ac.signal.addEventListener('abort', () => { settled = true; });
  el.addEventListener('animationend', e => { if (e.target === el) finish(); }, { signal: ac.signal });
  setTimeout(finish, ms);
  el.classList.add(cls);
}

function openApp(id, opts = {}) {
  const app = APPS[id];
  if (!app) return;

  if (app.href) {                                   // link-out tiles
    if (app.external) open(app.href, '_blank', 'noopener');
    else location.href = app.href;
    closeStart(); closeAllFlyouts();
    return;
  }

  const existing = S.wins.get(id);
  if (existing) {
    if (existing.min) restoreWindow(id); else focusWindow(id);
    closeStart(); closeAllFlyouts();
    return;
  }

  const d = deskRect();
  const mobile = isMobile();
  const w = mobile ? d.width  : Math.min(app.w, d.width  - 60);
  const hh = mobile ? d.height : Math.min(app.h, d.height - 60);
  const n = S.wins.size;
  const left = mobile ? 0 : clamp(Math.round((d.width - w) / 2) + ((n % 6) - 2.5) * 26, 8, Math.max(8, d.width - w - 8));
  const top  = mobile ? 0 : clamp(Math.round((d.height - hh) / 2) + ((n % 6) - 2.5) * 22, 8, Math.max(8, d.height - hh - 8));

  const el = h('section.win', {
    id: 'win-' + id, role: 'dialog', 'aria-label': app.name,
    style: { left: left + 'px', top: top + 'px', width: w + 'px', height: hh + 'px', zIndex: ++S.z }
  });
  el.innerHTML = `
    <header class="win-title">
      <div class="win-title-left">${icon(app.icon, 'ico')}<span class="t">${esc(app.name)}</span></div>
      <div class="win-caption">
        <button class="cap-btn" data-cap="min" aria-label="Minimize" data-tip="Minimize">${icon('u-min', '')}</button>
        <button class="cap-btn" data-cap="max" aria-label="Maximize" data-tip="Maximize">${icon('u-max', '')}</button>
        <button class="cap-btn close" data-cap="close" aria-label="Close" data-tip="Close">${icon('u-close', '')}</button>
      </div>
    </header>
    <div class="win-body"></div>
    ${['n','s','e','w','ne','nw','se','sw'].map(p => `<div class="rz rz-${p}" data-rz="${p}"></div>`).join('')}`;

  const bodyHost = $('.win-body', el);
  try {
    bodyHost.appendChild(app.build());
  } catch (err) {
    console.error('[' + id + ']', err);
    bodyHost.appendChild(h('div.empty', { html: icon('u-info', 'ico') + '<b>This app failed to load</b><p>Try reopening it.</p>' }));
  }

  layer().appendChild(el);
  S.wins.set(id, { id, app, el, min: false, max: false, prev: null });
  S.order.unshift(id);
  runAnim(el, 'anim-open');

  focusWindow(id);
  syncTaskbar();
  closeStart(); closeAllFlyouts();
  if (mobile) maximizeWindow(id, true);
  if (opts.snap) snapWindow(id, opts.snap);
}

function focusWindow(id) {
  const w = S.wins.get(id); if (!w) return;
  if (S.active === id && w.el.style.zIndex == S.z) return;
  w.el.style.zIndex = ++S.z;
  S.active = id;
  S.order = [id, ...S.order.filter(x => x !== id)];
  for (const [k, v] of S.wins) v.el.classList.toggle('active', k === id);
  syncTaskbar();
}

function closeWindow(id) {
  const w = S.wins.get(id); if (!w) return;
  runAnim(w.el, 'anim-close', () => {
    w.el.remove();
    S.wins.delete(id);
    S.order = S.order.filter(x => x !== id);
    if (S.active === id) { S.active = null; const nxt = S.order[0]; if (nxt) focusWindow(nxt); }
    syncTaskbar();
  }, 260);
}

function minimizeWindow(id) {
  const w = S.wins.get(id); if (!w || w.min) return;
  // Fly toward this window's own taskbar button, the way the real thing does.
  const btn = $(`#tb-apps [data-app="${id}"]`);
  if (btn) {
    const r = btn.getBoundingClientRect(), wr = w.el.getBoundingClientRect();
    w.el.style.setProperty('--min-x', (r.left + r.width / 2 - wr.left) + 'px');
  }
  w.min = true;
  runAnim(w.el, 'anim-min', () => { if (w.min) w.el.classList.add('hidden'); }, 300);
  if (S.active === id) {
    S.active = null;
    w.el.classList.remove('active');
    const nxt = S.order.find(x => x !== id && !S.wins.get(x)?.min);
    if (nxt) focusWindow(nxt);
  }
  syncTaskbar();
}

function restoreWindow(id) {
  const w = S.wins.get(id); if (!w) return;
  w.min = false;
  w.el.classList.remove('hidden');
  runAnim(w.el, 'anim-open');
  focusWindow(id);
  syncTaskbar();
}

function maximizeWindow(id, silent) {
  const w = S.wins.get(id); if (!w) return;
  const cap = $('[data-cap=max]', w.el);
  if (w.max) {
    w.max = false;
    w.el.classList.remove('maximized');
    if (w.prev) Object.assign(w.el.style, w.prev);
    cap.innerHTML = icon('u-max', ''); cap.dataset.tip = 'Maximize';
  } else {
    w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
    w.max = true;
    if (!silent) w.el.classList.add('snapping');
    w.el.classList.add('maximized');
    Object.assign(w.el.style, { left: '0px', top: '0px', width: '100%', height: '100%' });
    cap.innerHTML = icon('u-restore', ''); cap.dataset.tip = 'Restore';
    setTimeout(() => w.el.classList.remove('snapping'), 280);
  }
  focusWindow(id);
}

/* ------------------------------------------------------------
   6 · SNAP
   ------------------------------------------------------------ */
const SNAP_ZONES = {
  left:    { l: 0,    t: 0,   w: .5,    h: 1 },
  right:   { l: .5,   t: 0,   w: .5,    h: 1 },
  top:     { l: 0,    t: 0,   w: 1,     h: 1, max: true },
  left23:  { l: 0,    t: 0,   w: .655,  h: 1 },
  right13: { l: .655, t: 0,   w: .345,  h: 1 },
  c1:      { l: 0,    t: 0,   w: 1 / 3, h: 1 },
  c2:      { l: 1 / 3,t: 0,   w: 1 / 3, h: 1 },
  c3:      { l: 2 / 3,t: 0,   w: 1 / 3, h: 1 },
  tl:      { l: 0,    t: 0,   w: .5,    h: .5 },
  tr:      { l: .5,   t: 0,   w: .5,    h: .5 },
  bl:      { l: 0,    t: .5,  w: .5,    h: .5 },
  br:      { l: .5,   t: .5,  w: .5,    h: .5 }
};

function snapRect(zone) {
  const z = SNAP_ZONES[zone], d = deskRect();
  return { left: z.l * d.width, top: z.t * d.height, width: z.w * d.width, height: z.h * d.height };
}

function snapWindow(id, zone) {
  const w = S.wins.get(id); if (!w || !SNAP_ZONES[zone]) return;
  if (zone === 'top') { if (!w.max) maximizeWindow(id); return; }
  if (w.max) maximizeWindow(id, true);
  if (!w.prev) w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
  const r = snapRect(zone);
  w.el.classList.add('snapping');
  Object.assign(w.el.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  setTimeout(() => w.el.classList.remove('snapping'), 280);
  focusWindow(id);
}

/* ---- Unified pointer pipeline for drag + resize ---- */
let gesture = null;
let rafId = 0;

function beginGesture(e, win, mode, edge, handle) {
  const w = S.wins.get(win); if (!w) return;
  const r = w.el.getBoundingClientRect(), d = deskRect();
  gesture = {
    id: win, mode, edge,
    sx: e.clientX, sy: e.clientY,
    ox: r.left - d.left, oy: r.top - d.top, ow: r.width, oh: r.height,
    zone: null, next: null,
    wasMax: w.max
  };
  w.el.classList.add('dragging');
  // The listener sits on `document`, so read the cursor off the handle itself.
  document.body.style.cursor = mode === 'resize' && handle instanceof Element
    ? getComputedStyle(handle).cursor : 'grabbing';
  focusWindow(win);
}

function moveGesture(e) {
  if (!gesture) return;
  const w = S.wins.get(gesture.id); if (!w) return;
  const d = deskRect();
  const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;

  if (gesture.mode === 'drag') {
    // Dragging a maximized window pops it back to its previous size under the cursor.
    if (gesture.wasMax && Math.hypot(dx, dy) > 8) {
      const ratio = (e.clientX - d.left) / d.width;
      maximizeWindow(gesture.id, true);
      const nw = w.el.offsetWidth;
      gesture.ow = nw; gesture.oh = w.el.offsetHeight;
      gesture.ox = (e.clientX - d.left) - nw * ratio;
      gesture.oy = 8;
      gesture.sx = e.clientX; gesture.sy = e.clientY;
      gesture.wasMax = false;
    }
    const nx = clamp(gesture.ox + dx, -gesture.ow + 90, d.width - 90);
    const ny = clamp(gesture.oy + dy, 0, d.height - 34);
    gesture.next = { left: nx, top: ny };

    // Edge detection for Aero Snap
    const px = e.clientX - d.left, py = e.clientY - d.top, T = 22;
    let zone = null;
    if (py <= 6) zone = 'top';
    else if (px <= T) zone = py < d.height * .28 ? 'tl' : py > d.height * .72 ? 'bl' : 'left';
    else if (px >= d.width - T) zone = py < d.height * .28 ? 'tr' : py > d.height * .72 ? 'br' : 'right';
    if (zone !== gesture.zone) { gesture.zone = zone; showSnapPreview(zone); }
  } else {
    let { ox, oy, ow, oh } = gesture;
    const E = gesture.edge, MIN_W = 340, MIN_H = 220;
    if (E.includes('e')) ow = clamp(gesture.ow + dx, MIN_W, d.width - ox);
    if (E.includes('s')) oh = clamp(gesture.oh + dy, MIN_H, d.height - oy);
    if (E.includes('w')) { const nw = clamp(gesture.ow - dx, MIN_W, gesture.ox + gesture.ow); ox = gesture.ox + gesture.ow - nw; ow = nw; }
    if (E.includes('n')) { const nh = clamp(gesture.oh - dy, MIN_H, gesture.oy + gesture.oh); oy = gesture.oy + gesture.oh - nh; oh = nh; }
    gesture.next = { left: ox, top: oy, width: ow, height: oh };
  }

  if (!rafId) rafId = requestAnimationFrame(applyGesture);
}

function applyGesture() {
  rafId = 0;
  if (!gesture || !gesture.next) return;
  const w = S.wins.get(gesture.id); if (!w) return;
  const n = gesture.next;
  const s = w.el.style;
  s.left = n.left + 'px';
  s.top  = n.top + 'px';
  if (n.width  != null) s.width  = n.width + 'px';
  if (n.height != null) s.height = n.height + 'px';
}

function endGesture() {
  if (!gesture) return;
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; applyGesture(); }
  const w = S.wins.get(gesture.id);
  const zone = gesture.zone;
  if (w) w.el.classList.remove('dragging');
  document.body.style.cursor = '';
  hideSnapPreview();
  const id = gesture.id;
  gesture = null;
  if (zone && w) snapWindow(id, zone);
}

function showSnapPreview(zone) {
  const p = $('#snap-preview');
  if (!zone) { p.style.display = 'none'; return; }
  const r = snapRect(zone === 'top' ? 'top' : zone);
  Object.assign(p.style, { display: 'block', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
}
const hideSnapPreview = () => { $('#snap-preview').style.display = 'none'; };

/* Event wiring — delegated, so the number of open windows costs nothing. */
document.addEventListener('pointerdown', e => {
  const win = e.target.closest('.win');
  if (win) {
    const id = win.id.replace(/^win-/, '');
    focusWindow(id);
    const rz = e.target.closest('[data-rz]');
    if (rz && !isCoarse()) { e.preventDefault(); beginGesture(e, id, 'resize', rz.dataset.rz, rz); return; }
    const grip = e.target.closest('.win-title-left');
    if (grip && e.button === 0) { e.preventDefault(); beginGesture(e, id, 'drag'); return; }
  }
}, true);

document.addEventListener('pointermove', moveGesture, { passive: true });
document.addEventListener('pointerup', endGesture);
document.addEventListener('pointercancel', endGesture);

document.addEventListener('click', e => {
  const cap = e.target.closest('[data-cap]');
  if (cap) {
    const id = cap.closest('.win').id.replace(/^win-/, '');
    ({ min: minimizeWindow, max: maximizeWindow, close: closeWindow })[cap.dataset.cap](id);
    return;
  }
  const opener = e.target.closest('[data-open]');
  if (opener) { openApp(opener.dataset.open); }
});

document.addEventListener('dblclick', e => {
  const grip = e.target.closest('.win-title-left');
  if (grip) maximizeWindow(grip.closest('.win').id.replace(/^win-/, ''));
});

/* Snap-layouts flyout on the maximize button (Windows 11 behaviour) */
let snapHoverTimer = 0;
document.addEventListener('pointerover', e => {
  const btn = e.target.closest('[data-cap=max]');
  if (btn && !isCoarse() && !isMobile()) {
    clearTimeout(snapHoverTimer);
    snapHoverTimer = setTimeout(() => {
      const r = btn.getBoundingClientRect(), fly = $('#snap-layouts');
      fly.dataset.win = btn.closest('.win').id.replace(/^win-/, '');
      fly.classList.add('show');
      fly.style.left = clamp(r.right - 290, 8, innerWidth - 300) + 'px';
      fly.style.top = (r.bottom + 6) + 'px';
    }, 420);
  }
});
document.addEventListener('pointerout', e => {
  if (e.target.closest('[data-cap=max]')) {
    clearTimeout(snapHoverTimer);
    setTimeout(() => {
      const fly = $('#snap-layouts');
      if (!fly.matches(':hover') && !document.querySelector('[data-cap=max]:hover')) fly.classList.remove('show');
    }, 220);
  }
});
$('#snap-layouts').addEventListener('pointerleave', () => $('#snap-layouts').classList.remove('show'));
$('#snap-layouts').addEventListener('click', e => {
  const cell = e.target.closest('[data-snap]');
  if (!cell) return;
  const fly = $('#snap-layouts');
  snapWindow(fly.dataset.win, cell.dataset.snap);
  fly.classList.remove('show');
});
/* ------------------------------------------------------------
   7 · TASKBAR, START, FLYOUTS
   ------------------------------------------------------------ */

/** "Busy" means something is covering the desktop. While it is, the
    wallpaper stops drifting — nothing should be repainting underneath
    an acrylic surface just to animate pixels nobody can see. */
function syncBusy() {
  const busy =
    [...S.wins.values()].some(w => !w.min) ||
    $('#start').classList.contains('show') ||
    $('#quick').classList.contains('show') ||
    $('#noti').classList.contains('show') ||
    $('#taskview').classList.contains('show');
  document.body.classList.toggle('busy', busy);
}

function syncTaskbar() {
  const host = $('#tb-apps');
  const want = [...S.wins.keys()];
  // Reconcile rather than rebuild, so the pill indicators can animate.
  for (const btn of $$('[data-app]', host)) if (!want.includes(btn.dataset.app)) btn.remove();
  for (const id of want) {
    const w = S.wins.get(id);
    let btn = $(`[data-app="${id}"]`, host);
    if (!btn) {
      btn = h('button.tb-btn.app', { type: 'button', 'data-app': id, 'data-tip': w.app.name, 'aria-label': w.app.name });
      btn.innerHTML = icon(w.app.icon, 'ico');
      btn.addEventListener('click', () => {
        if (w.min) restoreWindow(id);
        else if (S.active === id) minimizeWindow(id);
        else focusWindow(id);
      });
      btn.addEventListener('pointerenter', () => showTaskPreview(btn, id));
      btn.addEventListener('pointerleave', hideTaskPreview);
      btn.addEventListener('contextmenu', ev => {
        ev.preventDefault(); ev.stopPropagation();
        showCtx(ev.clientX, ev.clientY, [
          { icon: 'u-restore', label: w.min ? 'Restore' : 'Maximize', on: () => w.min ? restoreWindow(id) : maximizeWindow(id) },
          { icon: 'u-min', label: 'Minimize', on: () => minimizeWindow(id) },
          { sep: 1 },
          { icon: 'u-grid', label: 'Snap left', on: () => snapWindow(id, 'left') },
          { icon: 'u-grid', label: 'Snap right', on: () => snapWindow(id, 'right') },
          { sep: 1 },
          { icon: 'u-close', label: 'Close window', danger: 1, on: () => closeWindow(id) }
        ]);
      });
      host.appendChild(btn);
    }
    btn.classList.toggle('active', S.active === id && !w.min);
    btn.classList.toggle('minimized', !!w.min);
  }
  syncBusy();
}

let previewTimer = 0;
function showTaskPreview(btn, id) {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    const w = S.wins.get(id); if (!w) return;
    const p = $('#tb-preview') || document.body.appendChild(h('div', { id: 'tb-preview' }));
    const text = ($('.pane, .term-out, .win-body', w.el)?.textContent || '').trim().slice(0, 260);
    p.innerHTML = `<div class="hd">${icon(w.app.icon, 'ico')}<b>${esc(w.app.name)}</b></div>
      <div class="thumb"><div class="bar"><i></i><i></i><i></i></div><div class="pv">${esc(text)}…</div></div>`;
    const r = btn.getBoundingClientRect();
    p.classList.add('show');
    p.style.left = clamp(r.left + r.width / 2 - 118, 8, innerWidth - 244) + 'px';
    p.style.top = (r.top - p.offsetHeight - 8) + 'px';
  }, 380);
}
function hideTaskPreview() { clearTimeout(previewTimer); $('#tb-preview')?.classList.remove('show'); }

/* ---- Start menu ---- */
function pinnedApps() { return Object.entries(APPS).filter(([, a]) => a.pin); }

function renderStart() {
  const grid = $('#st-pinned');
  grid.innerHTML = '';
  for (const [id, a] of pinnedApps()) {
    const b = h('button.st-app', { type: 'button', onclick: () => openApp(id), 'data-tip': a.tip || null });
    b.innerHTML = icon(a.icon) + `<span class="lbl">${esc(a.name)}</span>`;
    grid.appendChild(b);
  }
  const reco = $('#st-reco');
  reco.innerHTML = '';
  const items = [
    { icon: 'i-research', b: PAPERS[0].short + ' — ' + PAPERS[0].venue, s: PAPERS[0].status, go: () => openApp('research') },
    { icon: 'i-projects', b: 'Projects', s: PROJECTS.length + ' items across three folders', go: () => openApp('projects') },
    { icon: 'i-resume',   b: 'Resume', s: 'PDF · updated 2026', go: () => openApp('resume') },
    { icon: 'i-transformer', b: 'Transformer landing page', s: 'A forward pass, told as a story', go: () => openApp('transformer') }
  ];
  for (const it of items) {
    const b = h('button.st-item', { type: 'button', onclick: it.go });
    b.innerHTML = icon(it.icon) + `<div class="tx"><b>${esc(it.b)}</b><small>${esc(it.s)}</small></div>`;
    reco.appendChild(b);
  }
}

/* Search across apps, papers, projects and posts. */
function searchAll(q) {
  q = q.trim().toLowerCase();
  if (!q) return null;
  const out = [];
  for (const [id, a] of Object.entries(APPS)) {
    if (a.name.toLowerCase().includes(q)) out.push({ icon: a.icon, b: a.name, s: 'App', go: () => openApp(id) });
  }
  for (const p of PAPERS) {
    const hay = [p.title, p.short, p.venue, p.status, p.year, p.authors, p.abstract, ...p.tags, ...p.points].join(' ').toLowerCase();
    if (hay.includes(q))
      out.push({ icon: 'i-research', b: p.title, s: `${p.status} · ${p.venue}`, go: () => openApp('research') });
  }
  for (const p of PROJECTS) {
    if ([p.name, p.desc, p.kind, p.when, ...p.tags].join(' ').toLowerCase().includes(q))
      out.push({ icon: p.icon, b: p.name, s: `Project · ${p.kind}`, go: () => openApp('projects') });
  }
  for (const p of POSTS) {
    if ((p.t + ' ' + p.d + ' ' + p.tags.join(' ')).toLowerCase().includes(q))
      out.push({ icon: 'i-medium', b: p.t, s: 'Article · ' + p.pub, go: () => open(p.u, '_blank', 'noopener') });
  }
  for (const s of SKILLS.flatMap(g => g.items)) {
    if (s.n.toLowerCase().includes(q)) out.push({ icon: 'i-skills', b: s.n, s: 'Skill', go: () => openApp('skills') });
  }
  return out.slice(0, 14);
}

function runSearch(q) {
  const box = $('#st-results'), def = $('#st-default');
  const res = searchAll(q);
  if (res === null) { box.hidden = true; def.hidden = false; return; }
  def.hidden = true; box.hidden = false;
  box.innerHTML = '';
  box.appendChild(h('div.st-head', { html: `<h4>${res.length} result${res.length === 1 ? '' : 's'} for “${esc(q)}”</h4>` }));
  if (!res.length) {
    box.appendChild(h('div.empty', { html: icon('u-search', 'ico') + '<b>Nothing found</b><p>Try “multi-agent”, “TMLR”, “PyTorch” or “hackathon”.</p>' }));
    return;
  }
  const list = h('div.st-list');
  for (const r of res) {
    const b = h('button.st-item', { type: 'button', onclick: () => { r.go(); closeStart(); } });
    b.innerHTML = icon(r.icon) + `<div class="tx"><b>${esc(r.b)}</b><small>${esc(r.s)}</small></div>`;
    list.appendChild(b);
  }
  box.appendChild(list);
}

const startOpen = () => $('#start').classList.contains('show');
function toggleStart(force) {
  const s = $('#start'), want = force ?? !startOpen();
  closeAllFlyouts();
  s.classList.toggle('show', want);
  $('#start-btn').classList.toggle('on', want);
  if (want) { $('#st-q').value = ''; runSearch(''); setTimeout(() => { if (!isCoarse()) $('#st-q').focus(); }, 60); }
  syncBusy();
}
const closeStart = () => toggleStart(false);

function closeAllFlyouts(except) {
  for (const id of ['quick', 'noti']) {
    if (id === except) continue;
    $('#' + id).classList.remove('show');
  }
  if (except !== 'start') { $('#start').classList.remove('show'); $('#start-btn').classList.remove('on'); }
  $('#snap-layouts').classList.remove('show');
  hideCtx();
  syncBusy();
}

function toggleFlyout(id) {
  const el = $('#' + id), want = !el.classList.contains('show');
  closeAllFlyouts(want ? id : null);
  el.classList.toggle('show', want);
  if (id === 'noti' && want) renderCalendar();
  syncBusy();
}

/* ---- Toasts & notification centre ---- */
function toast(title, body, ic = 'i-mark', keep = true) {
  const t = h('div.toast', {
    html: icon(ic) + `<div><b>${esc(title)}</b><p>${esc(body)}</p></div>
           <button class="n-x" aria-label="Dismiss">${icon('u-close', '', 'style="width:12px;height:12px"')}</button>`
  });
  $('.n-x', t).addEventListener('click', () => dismiss());
  const dismiss = () => { t.classList.add('out'); setTimeout(() => t.remove(), 260); };
  $('#toasts').appendChild(t);
  setTimeout(dismiss, 5200);
  if (keep) {
    S.notifications.unshift({ title, body, ic, at: Date.now() });
    renderNotifications();
  }
}

function renderNotifications() {
  const l = $('#n-list');
  l.innerHTML = '';
  if (!S.notifications.length) {
    l.appendChild(h('div.n-empty', { html: icon('u-bell', 'ico', 'style="width:34px;height:34px;opacity:.4;margin:0 auto 10px"') + 'No new notifications' }));
    return;
  }
  S.notifications.forEach((n, i) => {
    const c = h('div.n-card', {
      html: `<div class="n-t">${icon(n.ic)}<span>${new Date(n.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
             <b>${esc(n.title)}</b><p>${esc(n.body)}</p>
             <button class="n-x" aria-label="Dismiss">${icon('u-close', '', 'style="width:12px;height:12px"')}</button>`
    });
    $('.n-x', c).addEventListener('click', () => { S.notifications.splice(i, 1); renderNotifications(); });
    l.appendChild(c);
  });
}

function renderCalendar() {
  const now = new Date();
  $('#cal-month').textContent = now.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const g = $('#cal-grid'); g.innerHTML = '';
  for (const d of ['S', 'M', 'T', 'W', 'T', 'F', 'S']) g.appendChild(h('span.dow', { text: d }));
  const first = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
  const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const prev = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  for (let i = first - 1; i >= 0; i--) g.appendChild(h('span.mute', { text: prev - i }));
  for (let d = 1; d <= days; d++) {
    const s = h('span', { text: d });
    if (d === now.getDate()) s.className = 'today';
    g.appendChild(s);
  }
  const rest = (7 - ((first + days) % 7)) % 7;
  for (let d = 1; d <= rest; d++) g.appendChild(h('span.mute', { text: d }));
}

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied', msg || 'Copied to clipboard.', 'u-copy'.startsWith('u') ? 'i-mark' : 'i-mark', false);
  } catch {
    const ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied', msg || 'Copied to clipboard.', 'i-mark', false); }
    catch { toast('Copy failed', text, 'i-mark', false); }
    ta.remove();
  }
}

/* ------------------------------------------------------------
   8 · DESKTOP ICONS
   ------------------------------------------------------------ */
/* On a desktop the icons run top-to-bottom in columns, as Windows does.
   On a phone they fill left-to-right like a home screen, which is what
   thumbs expect and what stops the right half of the screen sitting empty. */
let GRID = { x: 94, y: 100, pad: 8, cols: 1, rows: 1, flow: 'col' };

function measureGrid() {
  const d = deskRect(), mobile = isMobile();
  if (mobile) {
    const cols = clamp(Math.floor((d.width - 12) / 86), 3, 5);
    GRID = { x: (d.width - 12) / cols, y: 98, pad: 6, cols, rows: Math.max(1, Math.floor((d.height - 6) / 98)), flow: 'row' };
  } else {
    GRID = { x: 94, y: 100, pad: 8, cols: Math.max(1, Math.floor((d.width - 8) / 94)),
             rows: Math.max(1, Math.floor((d.height - 8) / 100)), flow: 'col' };
  }
  return GRID;
}

function desktopApps() { return Object.entries(APPS).filter(([, a]) => a.desktop); }

function renderIcons() {
  const host = $('#icon-layer');
  host.innerHTML = '';
  const g = measureGrid();
  const saved = store.get(g.flow === 'row' ? 'iconPosM' : 'iconPos', {});

  desktopApps().forEach(([id, a], i) => {
    const el = h('div.d-icon', {
      'data-app': id, tabindex: '0', role: 'button',
      'aria-label': a.name, 'data-tip': a.tip || null,
      style: g.flow === 'row' ? `width:${g.x}px` : null
    });
    el.innerHTML = icon(a.icon) + `<span class="lbl">${esc(a.name)}</span>`;
    const auto = g.flow === 'row'
      ? { c: i % g.cols, r: Math.floor(i / g.cols) }
      : { c: Math.floor(i / g.rows), r: i % g.rows };
    const pos = saved[id] || auto;
    placeIcon(el, clamp(pos.c, 0, g.cols - 1), Math.max(0, pos.r));
    host.appendChild(el);
  });
}

function placeIcon(el, c, r) {
  el.style.left = (GRID.pad + c * GRID.x) + 'px';
  el.style.top = (GRID.pad + r * GRID.y) + 'px';
  el.dataset.c = c; el.dataset.r = r;
}

function saveIconPositions() {
  const pos = {};
  $$('.d-icon').forEach(el => { pos[el.dataset.app] = { c: +el.dataset.c, r: +el.dataset.r }; });
  store.set(GRID.flow === 'row' ? 'iconPosM' : 'iconPos', pos);
}

/* Icon interaction: single click selects, double click (or Enter/tap) opens. */
(function iconInteraction() {
  const layer = $('#icon-layer');
  let drag = null, tapTime = 0, tapId = null;

  layer.addEventListener('pointerdown', e => {
    const el = e.target.closest('.d-icon');
    if (!el) return;
    if (e.button === 2) return;
    const r = el.getBoundingClientRect(), d = deskRect();
    drag = { el, sx: e.clientX, sy: e.clientY, ox: r.left - d.left, oy: r.top - d.top, moved: false };
    if (!e.shiftKey) $$('.d-icon.selected').forEach(x => x !== el && x.classList.remove('selected'));
    el.classList.add('selected');
    el.setPointerCapture?.(e.pointerId);
  });

  layer.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    drag.el.style.left = (drag.ox + dx) + 'px';
    drag.el.style.top = (drag.oy + dy) + 'px';
  }, { passive: true });

  layer.addEventListener('pointerup', e => {
    if (!drag) return;
    const { el, moved } = drag; drag = null;
    el.classList.remove('dragging');
    if (moved) {
      // Snap to the nearest free grid cell, walking on if that cell is taken.
      const g = GRID;
      let c = clamp(Math.round((parseFloat(el.style.left) - g.pad) / g.x), 0, g.cols - 1);
      let r = clamp(Math.round((parseFloat(el.style.top) - g.pad) / g.y), 0, g.rows - 1);
      const taken = new Set($$('.d-icon').filter(x => x !== el).map(x => x.dataset.c + ':' + x.dataset.r));
      let guard = 0;
      while (taken.has(c + ':' + r) && guard++ < 400) {
        if (g.flow === 'row') { c++; if (c >= g.cols) { c = 0; r++; } }
        else { r++; if (r >= g.rows) { r = 0; c++; } }
      }
      placeIcon(el, c, r);
      saveIconPositions();
      return;
    }
    // Tap / double-click to open.
    const id = el.dataset.app, now = Date.now();
    if (isCoarse()) { openApp(id); return; }
    if (tapId === id && now - tapTime < 480) { openApp(id); tapId = null; }
    else { tapId = id; tapTime = now; }
  });

  layer.addEventListener('dblclick', e => {
    const el = e.target.closest('.d-icon');
    if (el) openApp(el.dataset.app);
  });

  layer.addEventListener('keydown', e => {
    const el = e.target.closest('.d-icon');
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openApp(el.dataset.app); }
  });
})();

/* Marquee selection on empty desktop */
(function marquee() {
  const desk = $('#desktop'), box = $('#marquee');
  let sel = null;
  desk.addEventListener('pointerdown', e => {
    if (e.target !== desk && e.target !== $('#icon-layer')) return;
    if (e.button !== 0) return;
    const d = deskRect();
    sel = { x: e.clientX - d.left, y: e.clientY - d.top };
    $$('.d-icon.selected').forEach(x => x.classList.remove('selected'));
    box.style.display = 'block';
    Object.assign(box.style, { left: sel.x + 'px', top: sel.y + 'px', width: '0px', height: '0px' });
  });
  desk.addEventListener('pointermove', e => {
    if (!sel) return;
    const d = deskRect(), x = e.clientX - d.left, y = e.clientY - d.top;
    const l = Math.min(x, sel.x), t = Math.min(y, sel.y), w = Math.abs(x - sel.x), hh = Math.abs(y - sel.y);
    Object.assign(box.style, { left: l + 'px', top: t + 'px', width: w + 'px', height: hh + 'px' });
    const r = { l, t, r: l + w, b: t + hh };
    $$('.d-icon').forEach(el => {
      const b = el.getBoundingClientRect();
      const el2 = { l: b.left - d.left, t: b.top - d.top, r: b.right - d.left, b: b.bottom - d.top };
      el.classList.toggle('selected', !(el2.l > r.r || el2.r < r.l || el2.t > r.b || el2.b < r.t));
    });
  }, { passive: true });
  const stop = () => { if (sel) { sel = null; box.style.display = 'none'; } };
  desk.addEventListener('pointerup', stop);
  desk.addEventListener('pointercancel', stop);
})();

function toggleTaskView(force) {

/* Alt-Tab */
let altState = null;
function altTabStart(back) {
  const ids = S.order.filter(id => S.wins.has(id));
  if (ids.length < 2) { if (ids[0]) focusWindow(ids[0]); return; }
  if (!altState) altState = { ids, i: 0 };
  altState.i = (altState.i + (back ? -1 : 1) + altState.ids.length) % altState.ids.length;
  const box = $('#altab');
  box.innerHTML = '';
  altState.ids.forEach((id, n) => {
    const w = S.wins.get(id);
    const it = h('div.at-item' + (n === altState.i ? '.sel' : ''), { html: icon(w.app.icon) + `<span>${esc(w.app.name)}</span>` });
    it.addEventListener('click', () => { altState.i = n; altTabEnd(); });
    box.appendChild(it);
  });
  box.classList.add('show');
}
function altTabEnd() {
  if (!altState) return;
  const id = altState.ids[altState.i];
  $('#altab').classList.remove('show');
  altState = null;
  const w = S.wins.get(id);
  if (w) { if (w.min) restoreWindow(id); else focusWindow(id); }
}

/* Context menus */
function showCtx(x, y, items) {
  const m = $('#ctx');
  m.innerHTML = '';
  for (const it of items) {
    if (it.sep) { m.appendChild(h('div.ctx-sep')); continue; }
    const b = h('button.ctx-i' + (it.danger ? '.danger' : ''), {
      type: 'button', onclick: () => { hideCtx(); it.on?.(); }
    });
    b.innerHTML = icon(it.icon, '') + `<span>${esc(it.label)}</span>` + (it.kbd ? `<span class="kbd">${esc(it.kbd)}</span>` : '');
    m.appendChild(b);
  }
  m.classList.add('show');
  m.style.left = clamp(x, 6, innerWidth - m.offsetWidth - 6) + 'px';
  m.style.top = clamp(y, 6, innerHeight - m.offsetHeight - 6) + 'px';
}
const hideCtx = () => $('#ctx').classList.remove('show');

document.addEventListener('contextmenu', e => {
  const iconEl = e.target.closest('.d-icon');

});

document.addEventListener('pointerdown', e => {

/* Tooltips */
(function tooltips() {
  const tip = $('#tip');
  let timer = 0, cur = null;
  document.addEventListener('pointerover', e => {
    const t = e.target.closest('[data-tip]');
    if (!t || t === cur || isCoarse()) return;
    cur = t; clearTimeout(timer);
    timer = setTimeout(() => {
      if (!cur || !cur.isConnected) return;
      tip.textContent = cur.dataset.tip;
      tip.style.display = 'block';
      const r = cur.getBoundingClientRect();
      let top = r.top - tip.offsetHeight - 8;
      if (top < 6) top = r.bottom + 8;
      tip.style.left = clamp(r.left + r.width / 2 - tip.offsetWidth / 2, 6, innerWidth - tip.offsetWidth - 6) + 'px';
      tip.style.top = top + 'px';
    }, 620);
  });
  document.addEventListener('pointerout', e => {
    if (!e.target.closest('[data-tip]')) return;
    cur = null; clearTimeout(timer); tip.style.display = 'none';
  });
  document.addEventListener('pointerdown', () => { clearTimeout(timer); tip.style.display = 'none'; cur = null; });
})();

function buildTerminal() {
  const app = h('div.app');
  const term = h('div.term');
  const tabs = h('div.term-tabs', { html: `<div class="term-tab">${icon('u-code', '')}<span>saurab@portfolio: ~</span></div>` });
  const out = h('div.term-out.scroll');
  const line = h('div.term-line', {
    html: `<span class="p">saurab@portfolio:~$</span>`
  });
  const input = h('input', { type: 'text', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Terminal input' });
  line.appendChild(input);
  term.append(tabs, out, line);
  app.appendChild(term);

  const hist = [];
  let hi = -1;
  let cwd = '~';

  const write = (html) => {
    out.insertAdjacentHTML('beforeend', html + '\n');
    out.scrollTop = out.scrollHeight;
  };

  const FS = {
    '~': ['papers/', 'projects/', 'about.txt', 'contact.txt', 'skills.txt', 'README.md'],
    '~/papers': PAPERS.map(p => p.id + '.tex'),
    '~/projects': PROJECTS.map(p => p.id + '/')
  };

  const FILES = {
    'about.txt': () => `${ME.name}\n${ME.role}\n\n${ME.blurb}`,
    'contact.txt': () => `email    ${ME.email}\nalt      ${ME.altEmail}\nweb      ${ME.site}\ngithub   ${ME.github}\nlinkedin ${ME.linkedin}`,
    'skills.txt': () => SKILLS.map(g => `[${g.group}]\n` + g.items.map(s => `  ${s.n.padEnd(42, '.')} ${s.v}%`).join('\n')).join('\n\n'),
    'README.md': () => `# Portfolio OS\n\nA Windows-style desktop in one HTML file. No framework, no build step.\nType 'help' to see what this terminal can do.`
  };

  const CMDS = {
    help: () => write(
      `<span class="c">Available commands</span>\n` +
      [['help', 'this list'], ['about', 'who I am'], ['whoami', 'short version'],
       ['papers', 'manuscripts and their status'], ['projects [cat]', 'project list'],
       ['skills', 'skill breakdown'], ['contact', 'how to reach me'],
       ['ls [dir]', 'list files'], ['cd <dir>', 'change directory'], ['cat <file>', 'print a file'],
       ['open <app>', 'launch a desktop app'], ['apps', 'list launchable apps'],
       ['theme [dark|light]', 'switch theme'], ['wallpaper <name>', 'change wallpaper'],
       ['neofetch', 'system info'], ['date', 'current date and time'],
       ['echo <text>', 'print text'], ['history', 'command history'],
       ['clear', 'clear the screen'], ['exit', 'close the terminal']]
        .map(([c, d]) => `  <span class="w">${c.padEnd(20)}</span><span class="d">${d}</span>`).join('\n')),

    about: () => write(`<span class="c">${esc(ME.name)}</span> — ${esc(ME.role)}\n\n${esc(ME.blurb)}\n\n<span class="d">Type 'papers' for the research, or 'open about' for the full window.</span>`),
    whoami: () => write('saurab — BS-MS student, IISER Thiruvananthapuram. Multi-agent LLMs and the mathematics underneath them.'),

    papers: () => write(`<span class="c">${PAPERS.length} manuscripts</span> <span class="d">(none published yet — status shown per paper)</span>\n\n` +
      PAPERS.map(p => `  <span class="w">${p.short.padEnd(14)}</span><span class="${p.status === 'Under review' ? 'p' : 'm'}">${p.status.padEnd(16)}</span><span class="d">${p.venue}</span>\n    ${esc(p.title)}`).join('\n\n')),

    projects: a => {
      const cat = a[0];
      const list = cat ? PROJECTS.filter(p => p.cat === cat) : PROJECTS;
      if (!list.length) return write(`<span class="e">No projects in category '${esc(cat)}'.</span> <span class="d">Try research, applied or community.</span>`);
      write(`<span class="c">${list.length} projects</span>\n` + list.map(p =>
        `  <span class="w">${p.name.padEnd(28)}</span><span class="d">${p.kind} · ${p.when}</span>`).join('\n'));
    },

    skills: () => write(FILES['skills.txt']().split('\n').map(l =>
      l.startsWith('[') ? `<span class="c">${esc(l)}</span>` : esc(l)).join('\n')),

    contact: () => write(FILES['contact.txt']().split('\n').map(l => {
      const [k, ...v] = l.split(/\s+/);
      return `  <span class="w">${k.padEnd(10)}</span>${esc(v.join(' '))}`;
    }).join('\n')),

    ls: a => {
      const dir = a[0] ? (a[0].startsWith('~') ? a[0] : cwd + '/' + a[0]).replace(/\/$/, '') : cwd;
      const items = FS[dir];
      if (!items) return write(`<span class="e">ls: cannot access '${esc(a[0] || dir)}': No such directory</span>`);
      write(items.map(f => f.endsWith('/') ? `<span class="c">${esc(f)}</span>` : esc(f)).join('   '));
    },

    cd: a => {
      if (!a[0] || a[0] === '~') { cwd = '~'; return prompt_(); }
      if (a[0] === '..') { cwd = cwd.split('/').slice(0, -1).join('/') || '~'; return prompt_(); }
      const target = (a[0].startsWith('~') ? a[0] : cwd + '/' + a[0]).replace(/\/$/, '');
      if (FS[target]) { cwd = target; prompt_(); }
      else write(`<span class="e">cd: no such directory: ${esc(a[0])}</span>`);
    },

      if (!a[0]) return write('<span class="e">cat: missing file operand</span>');

      if (paper) return write(

    },

    open: a => {
      const id = (a[0] || '').toLowerCase();

      if (!APPS[id]) return write(`<span class="e">open: unknown app '${esc(id)}'</span>`);
      write(`<span class="p">Launching ${esc(APPS[id].name)}…</span>`);
      setTimeout(() => openApp(id), 180);
    },

    apps: () => write(Object.entries(APPS).map(([id, a]) =>
      `  <span class="w">${id.padEnd(14)}</span><span class="d">${a.name}</span>`).join('\n')),

    theme: a => {
      const t = a[0] || (root.dataset.theme === 'dark' ? 'light' : 'dark');
      if (!['dark', 'light'].includes(t)) return write('<span class="e">theme: expected "dark" or "light"</span>');
      setTheme(t);
      write(`<span class="p">Theme set to ${t}.</span>`);
    },

    wallpaper: a => {
      const k = (a[0] || '').toLowerCase();
      if (!k) return write('Available: <span class="c">' + Object.keys(WALLPAPERS).join(', ') + '</span>');
      if (!WALLPAPERS[k]) return write(`<span class="e">wallpaper: unknown '${esc(k)}'</span>`);
      applyWallpaper(k);
      write(`<span class="p">Wallpaper set to ${WALLPAPERS[k].name}.</span>`);
    },

    neofetch: () => write(
`<span class="c">        ▄▄▄▄▄▄▄▄        </span>  <span class="w">saurab@portfolio</span>
<span class="c">     ▄██████████████▄    </span>  ────────────────
<span class="c">   ▄████▀▀      ▀▀████▄  </span>  <span class="w">OS</span>        Portfolio OS (Fluent build)
<span class="c">  ████▀   ▄▄▄▄▄▄   ▀████ </span>  <span class="w">Host</span>      ${esc(ME.site)}
<span class="c"> ████    ████████    ████</span>  <span class="w">Kernel</span>    vanilla-js 0-dependency
<span class="c"> ████    ████████    ████</span>  <span class="w">Shell</span>     portfolio-sh
<span class="c">  ████▄   ▀▀▀▀▀▀   ▄████ </span>  <span class="w">Resolution</span> ${innerWidth}×${innerHeight}
<span class="c">   ▀████▄▄      ▄▄████▀  </span>  <span class="w">Theme</span>     ${root.dataset.theme} / ${root.dataset.accent}
<span class="c">     ▀██████████████▀    </span>  <span class="w">Windows</span>   ${S.wins.size} open
<span class="c">        ▀▀▀▀▀▀▀▀        </span>  <span class="w">Papers</span>    ${PAPERS.length} in flight
                            <span class="w">GPU</span>       whatever Kaggle gives me today`),

    date: () => write(new Date().toString()),
    echo: a => write(esc(a.join(' '))),
    history: () => write(hist.map((c, i) => `  <span class="d">${String(i + 1).padStart(3)}</span>  ${esc(c)}`).join('\n') || '<span class="d">empty</span>'),
    clear: () => { out.innerHTML = ''; },
    exit: () => { write('<span class="d">logout</span>'); setTimeout(() => closeWindow('terminal'), 300); },
    sudo: a => write(a.length
      ? `<span class="e">saurab is not in the sudoers file. This incident has been reported.</span>`
      : '<span class="e">usage: sudo &lt;command&gt;</span>'),
    pwd: () => write(cwd.replace('~', '/home/saurab')),
    cv: () => { write('<span class="p">Downloading resume…</span>'); h('a', { href: ME.cv, download: '' }).click(); }
  };
  CMDS.resume = CMDS.cv;
  CMDS.publications = CMDS.papers;
  CMDS.ll = CMDS.ls;

  function prompt_() {
    $('.p', line).textContent = `saurab@portfolio:${cwd}$`;
  }

  function run(raw) {
    const cmd = raw.trim();
    write(`<span class="p">saurab@portfolio:${cwd}$</span> ${esc(cmd)}`);
    if (!cmd) return;
    hist.push(cmd); hi = hist.length;
    const [name, ...args] = cmd.split(/\s+/);
    const fn = CMDS[name.toLowerCase()];
    if (fn) { try { fn(args); } catch (err) { write(`<span class="e">${esc(name)}: ${esc(err.message)}</span>`); } }
    else write(`<span class="e">${esc(name)}: command not found.</span> <span class="d">Type 'help'.</span>`);
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { run(input.value); input.value = ''; }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) input.value = hist[--hi] || ''; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ''; }
    else if (e.key === 'Tab') {
      e.preventDefault();
      const p = input.value.split(/\s+/).pop();
      const m = Object.keys(CMDS).filter(c => c.startsWith(p));
      if (m.length === 1) input.value = input.value.replace(/\S*$/, m[0] + ' ');
      else if (m.length > 1) write(m.join('   '));
    }
    else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); out.innerHTML = ''; }
    else if (e.key === 'c' && e.ctrlKey) { write(`<span class="p">saurab@portfolio:${cwd}$</span> ${esc(input.value)}^C`); input.value = ''; }
  });

  term.addEventListener('click', e => { if (!getSelection().toString()) input.focus(); });

  write(`<span class="c">Portfolio OS</span> [Version 3.0.2026]\n<span class="d">© ${new Date().getFullYear()} Saurab Mishra. Type 'help' for commands, 'neofetch' for the obligatory.</span>\n`);
  setTimeout(() => { if (!isCoarse()) input.focus(); }, 260);
  prompt_();
  return app;
}

/* ---- Clock ---- */
function tickClock() {
  const now = new Date();
  const t = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const d = now.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });
  $('#clk-time').textContent = t;
  $('#clk-date').textContent = d;
  $('#tray-clock').dataset.tip = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('#lk-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('#lk-date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
}

/* ---- Network ---- */
function updateNetwork() {
  const on = navigator.onLine !== false;
  const use = $('#tray-net use');
  use.setAttribute('href', on ? '#u-wifi' : '#u-wifi-off');
  const tile = $('#q-wifi');
  tile.classList.toggle('on', on);
  $('svg use', tile).setAttribute('href', on ? '#u-wifi' : '#u-wifi-off');
  const c = navigator.connection;
  tile.querySelector('span').textContent = on ? (c?.effectiveType ? c.effectiveType.toUpperCase() : 'Connected') : 'Offline';
}

/* ---- Battery ---- */
async function initBattery() {
  const paint = (level, charging) => {
    const pct = Math.round(level * 100);
    const bar = $('#tray-bat .bfill');
    if (bar) { bar.setAttribute('width', Math.max(1, 13.8 * level).toFixed(1)); }
    $('#tray').dataset.tip = `${pct}%${charging ? ' · charging' : ''} · network, sound, battery`;
  };
  try {
    const b = await navigator.getBattery?.();
    if (!b) throw 0;
    const upd = () => paint(b.level, b.charging);
    upd();
    b.addEventListener('levelchange', upd);
    b.addEventListener('chargingchange', upd);
  } catch {
    paint(0.86, false);           // no Battery API — show a plausible steady state
  }
}

/* ---- Volume / brightness ---- */
function initSliders() {
  const paint = i => i.style.setProperty('--pct', ((i.value - i.min) / (i.max - i.min) * 100) + '%');
  const vol = $('#q-volume'), br = $('#q-bright');
  const applyVol = () => {
    paint(vol);
    const v = +vol.value;
    $('#tray-vol use').setAttribute('href', v === 0 ? '#u-vol-off' : '#u-vol');
    store.set('vol', v);
  };
  const applyBr = () => {
    paint(br);
    // A real brightness control we can actually honour: dim the wallpaper.
    $('#wallpaper').style.filter = `brightness(${br.value / 100})`;
    store.set('bright', +br.value);
  };
  vol.value = store.get('vol', 65); br.value = store.get('bright', 100);
  vol.addEventListener('input', applyVol);
  br.addEventListener('input', applyBr);
  applyVol(); applyBr();
}

/* ---- Show desktop ---- */
let peeked = false;
function showDesktop() {
  const anyVisible = [...S.wins.values()].some(w => !w.min);
  if (anyVisible) { peeked = [...S.wins.keys()].filter(id => !S.wins.get(id).min); peeked.forEach(minimizeWindow); }
  else if (peeked) { peeked.forEach(restoreWindow); peeked = false; }
}

/* ---- Lock screen ---- */
function lock() {
  closeAllFlyouts();
  const l = $('#lock');
  l.classList.remove('leaving');
  l.classList.add('show');
  tickClock();
}
function unlock() {
  const l = $('#lock');
  l.classList.add('leaving');
  setTimeout(() => { l.classList.remove('show', 'leaving'); }, 420);
}
$('#lock').addEventListener('click', unlock);
$('#lk-go').addEventListener('click', e => { e.stopPropagation(); unlock(); });

/* ---- Power menu ---- */
function powerMenu(x, y) {
  showCtx(x, y, [
    { icon: 'u-lock', label: 'Lock', kbd: 'Win+L', on: lock },
    { icon: 'u-user', label: 'Sign out', on: () => { closeAllWindows(); lock(); } },

    { icon: 'u-refresh', label: 'Restart', on: () => location.reload() },
    { icon: 'u-power', label: 'Shut down', danger: 1, on: shutdown }
  ]);
}
function closeAllWindows() { [...S.wins.keys()].forEach(closeWindow); }
function shutdown() {
  const veil = h('div', {
    style: 'position:fixed;inset:0;z-index:2000;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-size:15px;opacity:0;transition:opacity .5s',
    html: `<svg class="ring" viewBox="0 0 36 36" style="width:34px;height:34px"><circle cx="18" cy="18" r="15" style="fill:none;stroke:rgba(255,255,255,.85);stroke-width:3;stroke-linecap:round;stroke-dasharray:22 66;transform-origin:center;animation:bootSpin 1.1s linear infinite"/></svg>
           <div>Shutting down…</div>`
  });
  document.body.appendChild(veil);
  requestAnimationFrame(() => veil.style.opacity = '1');
  setTimeout(() => {
    veil.innerHTML = `<div style="text-align:center;line-height:1.7">

      <button style="margin-top:22px;height:34px;padding:0 20px;border-radius:17px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;cursor:pointer">Power on</button></div>`;
    veil.querySelector('button').addEventListener('click', () => location.reload());
  }, 2100);
}

/* ---- Keyboard ---- */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  const meta = e.metaKey;                              // treated as the Windows key

  if (e.key === 'Alt' && !e.repeat) { /* wait for Tab */ }
  if (e.key === 'Tab' && e.altKey) { e.preventDefault(); altTabStart(e.shiftKey); return; }

  if (meta) {
    const k = e.key.toLowerCase();
    const map = {
      d: () => showDesktop(),
      e: () => openApp('projects'),
      a: () => toggleFlyout('quick'),
      n: () => toggleFlyout('noti'),
      l: () => lock(),
      tab: () => toggleTaskView()
    };
    if (map[k]) { e.preventDefault(); map[k](); return; }
    if (k === 'arrowleft'  && S.active) { e.preventDefault(); snapWindow(S.active, 'left'); return; }
    if (k === 'arrowright' && S.active) { e.preventDefault(); snapWindow(S.active, 'right'); return; }
    if (k === 'arrowup'    && S.active) { e.preventDefault(); if (!S.wins.get(S.active).max) maximizeWindow(S.active); return; }
    if (k === 'arrowdown'  && S.active) { e.preventDefault(); const w = S.wins.get(S.active); w.max ? maximizeWindow(S.active) : minimizeWindow(S.active); return; }
  }

  if (e.key === 'Tab' && e.metaKey) { e.preventDefault(); toggleTaskView(); return; }
  if (e.key === 'Escape' && e.ctrlKey) { e.preventDefault(); toggleStart(); return; }

  if (e.key === 'Escape') {
    if ($('#altab').classList.contains('show')) { altTabEnd(); return; }
    if ($('#taskview').classList.contains('show')) { toggleTaskView(false); return; }
    if ($('#ctx').classList.contains('show')) { hideCtx(); return; }
    if (startOpen() || $('#quick').classList.contains('show') || $('#noti').classList.contains('show')) { closeAllFlyouts(); return; }
    if ($('#lock').classList.contains('show')) { unlock(); return; }
    return;
  }
  if ($('#lock').classList.contains('show') && e.key === 'Enter') { unlock(); return; }

  if (typing) return;

  if (e.key === 'F5') { e.preventDefault(); renderIcons(); toast('Desktop', 'Refreshed.', 'i-pc', false); return; }
  if (e.key.toLowerCase() === 'w' && e.ctrlKey && S.active) { e.preventDefault(); closeWindow(S.active); return; }
  if (e.key === 'Meta' && !e.repeat) { /* Start on keyup, below */ }
});

document.addEventListener('keyup', e => {
  if (e.key === 'Alt' && altState) altTabEnd();
  // Tapping the Windows key on its own opens Start, as it does on the real thing.
  if (e.key === 'Meta' && !e.ctrlKey && !e.shiftKey && !e.altKey) {
    if (!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) toggleStart();
  }
});

/* ---- Viewport changes ---- */
let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    document.body.classList.toggle('mobile', isMobile());
    const d = deskRect();
    // Keep every window inside the viewport after a resize.
    for (const [, w] of S.wins) {
      if (w.max) continue;
      const el = w.el;
      const width = Math.min(el.offsetWidth, d.width - 16);
      const height = Math.min(el.offsetHeight, d.height - 16);
      el.style.width = width + 'px';
      el.style.height = height + 'px';
      el.style.left = clamp(parseFloat(el.style.left) || 0, 0, Math.max(0, d.width - width)) + 'px';
      el.style.top = clamp(parseFloat(el.style.top) || 0, 0, Math.max(0, d.height - height)) + 'px';
    }
    const res = $('#set-res'); if (res) res.textContent = `${innerWidth} × ${innerHeight}`;
    renderIcons();
  }, 160);
});

  const f = e.target.files?.[0];
  if (!f) return;
  if (f.size > 6e6) { toast('Background', 'That image is over 6 MB — pick a smaller one.', 'i-photos', false); return; }
  const r = new FileReader();
  r.onload = () => { store.set('wallCustom', r.result); applyWallpaper('custom'); toast('Background', 'Wallpaper updated.', 'i-photos', false); };
  r.readAsDataURL(f);
  e.target.value = '';
});

addEventListener('online', updateNetwork);
addEventListener('offline', updateNetwork);
navigator.connection?.addEventListener?.('change', updateNetwork);

/* ---- Boot ---- */
function boot() {
  // First visit follows the system's own light/dark preference, and picks a
  // wallpaper that belongs with it rather than a dark bloom under a light shell.
  const prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
  setTheme(store.get('theme', prefersLight ? 'light' : 'dark'));
  setAccent(store.get('accent', 'blue'));
  setTransparency(store.get('transparency', !matchMedia('(max-width:820px)').matches));
  setAnimations(store.get('anim', !matchMedia('(prefers-reduced-motion: reduce)').matches));
  applyWallpaper(store.get('wallCustom', null) ? 'custom' : store.get('wall', prefersLight ? 'frost' : 'aurora'));

  document.body.classList.toggle('mobile', isMobile());
  renderIcons();
  renderStart();
  renderNotifications();
  renderCalendar();
  tickClock();
  setInterval(tickClock, 1000 * 15);
  updateNetwork();
  initBattery();
  initSliders();
  syncTaskbar();

  const first = !store.get('visited', false);
  store.set('visited', true);

  // Deep link: /index.html#research opens that app straight away.
  const wanted = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
  const deepLink = APPS[wanted] && !APPS[wanted].href ? wanted : null;
  addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
    if (APPS[id] && !APPS[id].href) openApp(id);
  });

  setTimeout(() => {
    $('#boot').classList.add('done');
    setTimeout(() => $('#boot').remove(), 500);

    setTimeout(() => {
      const touch = isCoarse() || isMobile();
      toast('Welcome', first
        ? (touch
            ? 'Tap an icon to open it, or tap Start to search everything on this desktop.'
            : 'Double-click an icon, or press the Windows key to open Start. Try the Terminal — it works.')
        : 'Welcome back. Your theme, wallpaper and icon layout were restored.', 'i-mark');
      if (deepLink) openApp(deepLink);
      else if (first && !isMobile()) setTimeout(() => openApp('about'), 900);
    }, 500);
  }, 620);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
